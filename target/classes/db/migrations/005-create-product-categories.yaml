databaseChangeLog:
  - changeSet:
      id: 005-create-product-categories
      author: hikaro
      changes:
        - createTable:
            tableName: product_categories
            columns:
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: product_categories
            columnNames: category_id, product_id
            constraintName: pk_product_categories
        - addForeignKeyConstraint:
            baseTableName: product_categories
            baseColumnNames: product_id
            constraintName: fk_product_categories_product
            referencedTableName: products
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: product_categories
            baseColumnNames: category_id
            constraintName: fk_product_categories_category
            referencedTableName: categories
            referencedColumnNames: id
