databaseChangeLog:
  - changeSet:
      id: 003-create-categories
      author: hikaro
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categories
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_categories_name
              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
