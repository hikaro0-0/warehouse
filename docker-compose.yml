services:
  postgres:
    image: postgres:16-alpine
    container_name: warehouse-postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_DB: warehouse_db
      POSTGRES_USER: hikaro
      POSTGRES_PASSWORD: 12345678
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hikaro -d warehouse_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
