name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  BACKEND_HEALTH_URL: https://warehouse-accounting-api.onrender.com/actuator/health
  FRONTEND_HEALTH_URL: https://warehouse-accounting-web.onrender.com/

jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run backend build and tests
        run: ./mvnw -B verify -Dcheckstyle.skip=true

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080/api
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t warehouse-backend:ci .

      - name: Build frontend image
        run: docker build -t warehouse-frontend:ci --build-arg VITE_API_BASE_URL=http://localhost:8080/api ./frontend

  deploy_backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs:
      - docker
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')

    steps:
      - name: Trigger backend deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing secret: RENDER_BACKEND_DEPLOY_HOOK_URL"
            exit 1
          fi

          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

  deploy_frontend:
    name: Deploy Frontend to Render
    runs-on: ubuntu-latest
    needs:
      - docker
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')

    steps:
      - name: Trigger frontend deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing secret: RENDER_FRONTEND_DEPLOY_HOOK_URL"
            exit 1
          fi

          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

  backend_healthcheck:
    name: Backend Healthcheck
    runs-on: ubuntu-latest
    needs:
      - deploy_backend
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')

    steps:
      - name: Wait for backend healthcheck
        run: |
          for attempt in $(seq 1 30); do
            response="$(curl -fsS "$BACKEND_HEALTH_URL" || true)"
            echo "Attempt $attempt"
            echo "$response"

            if echo "$response" | grep -q '"status":"UP"'; then
              exit 0
            fi

            sleep 20
          done

          echo "Backend healthcheck failed"
          exit 1

  frontend_healthcheck:
    name: Frontend Healthcheck
    runs-on: ubuntu-latest
    needs:
      - deploy_frontend
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')

    steps:
      - name: Wait for frontend healthcheck
        run: |
          for attempt in $(seq 1 30); do
            http_code="$(curl -L -s -o /dev/null -w '%{http_code}' "$FRONTEND_HEALTH_URL" || true)"
            echo "Attempt $attempt: HTTP $http_code"

            case "$http_code" in
              200|301|302|307|308)
                exit 0
                ;;
            esac

            sleep 20
          done

          echo "Frontend healthcheck failed"
          exit 1
