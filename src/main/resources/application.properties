spring.config.import=optional:file:.env[.properties]
spring.application.name=warehouse-accounting

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:warehouse_db}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:hikaro}
spring.datasource.password=${POSTGRES_PASSWORD:12345678}
spring.datasource.hikari.schema=${DB_SCHEMA:public}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/db.changelog-master.yaml
spring.liquibase.default-schema=${DB_SCHEMA:public}
spring.liquibase.liquibase-schema=${DB_SCHEMA:public}
spring.sql.init.mode=never
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

app.logging.path=${APP_LOG_PATH:logs}
app.logging.file=${APP_LOG_FILE:warehouse.log}
