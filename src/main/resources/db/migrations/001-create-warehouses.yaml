databaseChangeLog:
  - changeSet:
      id: 001-create-warehouses
      author: hikaro
      changes:
        - createTable:
            tableName: warehouses
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_warehouses
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_warehouses_name
              - column:
                  name: address
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
