databaseChangeLog:
  - changeSet:
      id: 007-create-shipment-products
      author: hikaro
      changes:
        - createTable:
            tableName: shipment_products
            columns:
              - column:
                  name: shipment_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: shipment_products
            columnNames: product_id, shipment_id
            constraintName: pk_shipment_products
        - addForeignKeyConstraint:
            baseTableName: shipment_products
            baseColumnNames: shipment_id
            constraintName: fk_shipment_products_shipment
            referencedTableName: shipments
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: shipment_products
            baseColumnNames: product_id
            constraintName: fk_shipment_products_product
            referencedTableName: products
            referencedColumnNames: id
