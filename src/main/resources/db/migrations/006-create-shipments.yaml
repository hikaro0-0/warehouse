databaseChangeLog:
  - changeSet:
      id: 006-create-shipments
      author: hikaro
      changes:
        - createTable:
            tableName: shipments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_shipments
                    nullable: false
              - column:
                  name: reference_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_shipments_reference_number
              - column:
                  name: warehouse_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: shipments
            baseColumnNames: warehouse_id
            constraintName: fk_shipments_warehouse
            referencedTableName: warehouses
            referencedColumnNames: id
