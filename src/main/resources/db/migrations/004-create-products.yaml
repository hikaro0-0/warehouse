databaseChangeLog:
  - changeSet:
      id: 004-create-products
      author: hikaro
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_products
                    nullable: false
              - column:
                  name: sku
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_products_sku
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: warehouse_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: supplier_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: warehouse_id
            constraintName: fk_products_warehouse
            referencedTableName: warehouses
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: supplier_id
            constraintName: fk_products_supplier
            referencedTableName: suppliers
            referencedColumnNames: id
