databaseChangeLog:
  - changeSet:
      id: 020-create-dispatch-items
      author: hikaro
      changes:
        - createTable:
            tableName: dispatch_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_dispatch_items
                    nullable: false
              - column:
                  name: dispatch_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: dispatch_items
            baseColumnNames: dispatch_id
            constraintName: fk_dispatch_items_dispatch
            referencedTableName: dispatches
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: dispatch_items
            baseColumnNames: product_id
            constraintName: fk_dispatch_items_product
            referencedTableName: products
            referencedColumnNames: id
