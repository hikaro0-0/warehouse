databaseChangeLog:
  - changeSet:
      id: 018-create-recipients
      author: hikaro
      changes:
        - createTable:
            tableName: recipients
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_recipients
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_recipients_name
              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: contact_email
                  type: VARCHAR(255)
              - column:
                  name: address
                  type: VARCHAR(255)
